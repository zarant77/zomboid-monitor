<div class="page">
<header class="hero" data-hero="">
<div id="language-switcher" class="language-switcher" role="group" data-i18n-aria-label="Choose language">
<button type="button" data-language="en" data-i18n-aria-label="Switch to English" data-i18n-title="Switch to English" aria-pressed="true"><svg viewBox="0 0 28 20" aria-hidden="true"><rect width="28" height="20" rx="3" fill="#173452"/><path d="m2 2 24 16M26 2 2 18" stroke="#f1f4f6" stroke-width="4"/><path d="m2 2 24 16M26 2 2 18" stroke="#cf5265" stroke-width="1.5"/><path d="M14 0v20M0 10h28" stroke="#f1f4f6" stroke-width="7"/><path d="M14 0v20M0 10h28" stroke="#cf5265" stroke-width="4"/></svg><span>EN</span></button>
<button type="button" data-language="uk" data-i18n-aria-label="Switch to Ukrainian" data-i18n-title="Switch to Ukrainian" aria-pressed="false"><svg viewBox="0 0 28 20" aria-hidden="true"><rect width="28" height="20" rx="3" fill="#f4cf49"/><path d="M3 0h22a3 3 0 0 1 3 3v7H0V3a3 3 0 0 1 3-3" fill="#4289d5"/></svg><span>UK</span></button>

<div class="brand"><svg class="icon brand-icon"><use href="#i-person"/></svg><span><span data-i18n="PROJECT ZOMBOID"></span><br><span class="muted"><span data-i18n="SERVER MONITOR"></span></span></span></div>
<h1><span data-i18n="28 Kills Later"></span></h1>
<p id="hero-subtitle" class="hero-subtitle">—</p>
<div class="hero-live"><strong id="status" class="live-status waiting"><span class="status-marker" aria-hidden="true"><span class="status-dot"></span><svg class="refresh-ring" viewBox="0 0 32 32"><circle class="refresh-track" cx="16" cy="16" r="14"/><circle id="refresh-progress" cx="16" cy="16" r="14" pathLength="100"/></svg></span><span id="status-label"><span data-i18n="WAITING"></span></span></strong></div>
<p id="connection-message" class="connection-message" role="status"></p>
</header>
<main>
<section class="panel server-panel" aria-labelledby="server-heading">
<div class="server-top"><div class="server-identity"><span class="server-icon"><svg class="icon"><use href="#i-server"/></svg></span><div><h2 id="server-heading" class="eyebrow"><span data-i18n="SERVER"></span></h2><h3 id="server-name"><span data-i18n="Project Zomboid"></span></h3><div class="address-line"><span id="address" class="mono">—</span><button class="icon-button copy-address" aria-label="" data-i18n-aria-label="Copy server address"><svg class="icon"><use href="#i-copy"/></svg></button><span class="copy-feedback" role="status"></span></div></div></div><div id="server-badges" class="badges"></div></div>
<div id="server-metrics" class="server-metrics"></div><p id="server-error" class="error" role="status"></p>
</section>
<div class="primary-grid">
<section class="panel" aria-labelledby="players-heading"><div class="panel-heading"><h2 id="players-heading"><span class="dot green"></span><span data-i18n="Online Players"></span><span id="online-count">(0)</span></h2><a href="#leaderboard-section" class="text-link"><span data-i18n="View all"></span><span aria-hidden="true">→</span></a></div><div class="table-wrap"><table class="online-table"><thead><tr><th>#</th><th><span data-i18n="Player"></span></th><th><span data-i18n="Kills"></span></th><th><span data-i18n="Session"></span></th><th><span data-i18n="Joined"></span></th></tr></thead><tbody id="players"></tbody></table></div><p id="players-note" class="note"></p></section>
<section class="panel statistics" aria-labelledby="stats-heading"><div class="panel-heading"><h2 id="stats-heading"><svg class="icon blue"><use href="#i-chart"/></svg><span data-i18n="Server Statistics"></span></h2><div class="segmented" id="period-filter" role="group" aria-label="" data-i18n-aria-label="Statistics period"><button data-period="24h" aria-pressed="true"><span data-i18n="24h"></span></button><button data-period="7d" aria-pressed="false"><span data-i18n="7d"></span></button><button data-period="30d" aria-pressed="false"><span data-i18n="30d"></span></button></div></div><div id="stats-metrics" class="stats-metrics"></div><div class="chart-heading"><span id="chart-title"><span data-i18n="chartTitle" data-i18n-default-period="period24h"></span></span><span class="legend"><span><i class="dot green"></i><span data-i18n="Players"></span></span><span><i class="dot blue-bg"></i><span data-i18n="Ping (ms)"></span></span></span></div><div class="chart-wrap" id="history-chart"><svg id="chart" viewBox="0 0 520 160" role="img" aria-label="" data-i18n-aria-label="Historical player count and ping"></svg><div id="chart-tooltip" class="chart-tooltip" hidden></div><p id="chart-empty" class="chart-empty"><span data-i18n="No samples in this period yet."></span></p></div><p id="stats-note" class="note"><span data-i18n="Period statistics · tracked players across all history"></span></p></section>
</div>
<section id="leaderboard-section" class="panel" aria-labelledby="leaderboard-heading"><div class="panel-heading leaderboard-heading"><h2 id="leaderboard-heading"><svg class="icon amber"><use href="#i-trophy"/></svg><span data-i18n="Leaderboard"></span></h2><div class="segmented" id="leaderboard-filter" role="group" aria-label="" data-i18n-aria-label="Leaderboard filter"><button data-filter="all" aria-pressed="true"><span data-i18n="All players"></span></button><button data-filter="online" aria-pressed="false"><span data-i18n="Online only"></span></button><button data-filter="offline" aria-pressed="false"><span data-i18n="Offline only"></span></button></div><span class="leaderboard-caption"><span data-i18n="Highest observed kills · all players"></span></span></div><table class="leaderboard-table"><thead><tr><th>#</th><th><span data-i18n="Player"></span></th><th><span data-i18n="Kills"></span><span class="green">↓</span></th><th><span data-i18n="Status"></span></th><th><span data-i18n="Last seen"></span></th><th><span data-i18n="First seen"></span></th><th><span data-i18n="Best session"></span></th><th><span data-i18n="Gain (tracked)"></span></th></tr></thead><tbody id="leaderboard"></tbody></table><p class="note"><span data-i18n="Gain counts positive score changes observed by this monitor; initial kills are excluded."></span></p></section>
<div class="bottom-grid">
<section class="panel events-panel" aria-labelledby="events-heading"><div class="panel-heading"><h2 id="events-heading"><svg class="icon blue"><use href="#i-clock"/></svg><span data-i18n="Recent Events"></span></h2></div><div class="segmented" id="event-filter" role="group" aria-label="" data-i18n-aria-label="Event filter"><button data-event="all" aria-pressed="true"><span data-i18n="All"></span></button><button data-event="join" aria-pressed="false"><span data-i18n="Joins"></span></button><button data-event="leave" aria-pressed="false"><span data-i18n="Leaves"></span></button><button data-event="server" aria-pressed="false"><span data-i18n="Server"></span></button></div><ul id="events" class="event-list"></ul><button id="load-events" class="text-button"><span data-i18n="Load more"></span></button><p id="events-note" class="note"></p></section>
<section class="panel mods-panel" aria-labelledby="mods-heading"><div class="panel-heading"><h2 id="mods-heading"><svg class="icon blue"><use href="#i-mods"/></svg><span data-i18n="Mods"></span></h2></div><div class="mod-counters"><div class="metric"><strong id="mods-total">—</strong><span><span data-i18n="Total mods"></span></span></div><div class="metric"><strong id="mods-reported">—</strong><span><span data-i18n="Reported by server"></span></span></div></div><div id="mods-warning" class="warning" hidden><svg class="icon amber"><use href="#i-info"/></svg><div><strong><span data-i18n="Incomplete list"></span></strong><p id="mods-warning-text"></p></div></div><div id="mods" class="mod-tags"></div><p id="mods-missing" class="note"></p></section>
<section class="panel info-panel" aria-labelledby="info-heading"><div class="panel-heading"><h2 id="info-heading"><svg class="icon blue"><use href="#i-info"/></svg><span data-i18n="Server Info"></span></h2></div><dl id="server-info" class="info-list"></dl></section>
</div>
<details class="panel description-panel"><summary><svg class="icon blue"><use href="#i-file"/></svg><h2><span data-i18n="Server Description"></span></h2><span class="chevron" aria-hidden="true">⌄</span></summary><div id="description" class="description"><span data-i18n="No description reported."></span></div></details>
<p id="state-note" class="footer-note"></p>
</main>
<footer><span data-i18n="28 Kills Later · Checks run sequentially · History persisted in SQLite"></span></footer>
</div>
<dialog id="player-dialog" aria-labelledby="player-dialog-title"><div class="dialog-heading"><div><div class="eyebrow"><span data-i18n="PLAYER DETAILS"></span></div><h2 id="player-dialog-title"><span data-i18n="Player"></span></h2><p id="player-dialog-status"></p></div><button id="close-player" class="icon-button" aria-label="" data-i18n-aria-label="Close player details">✕</button></div><div id="player-details" class="detail-grid"></div><h3 class="detail-subtitle"><span data-i18n="Observed join / leave snapshots"></span></h3><div id="player-timeline" class="player-timeline"></div><p id="player-detail-note" class="note"></p></dialog>
</body>
</html>
